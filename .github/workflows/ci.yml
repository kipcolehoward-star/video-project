name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - infra/vps-migration-and-project-archive

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate server shell scripts
        run: |
          set -euo pipefail
          for file in scripts/server/*.sh; do
            echo "Checking $file"
            bash -n "$file"
          done

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows deployment and archive scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts/server -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "Parsed $($file.Name)"
          }
